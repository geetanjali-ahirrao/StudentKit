<div class="qty" [class.qty--disabled]="disabled()" [class.qty--invalid]="invalid()">
  <button
    type="button"
    class="qty__btn"
    [disabled]="!canDecrease"
    [attr.aria-label]="'Decrease ' + label()"
    (click)="step(-1)"
  >
    <app-icon name="minus" [size]="16" [strokeWidth]="2.2" />
  </button>

  <input
    class="qty__field"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    [value]="display()"
    [disabled]="disabled()"
    [attr.aria-label]="label()"
    [attr.aria-invalid]="invalid()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <button
    type="button"
    class="qty__btn"
    [disabled]="!canIncrease"
    [attr.aria-label]="'Increase ' + label()"
    (click)="step(1)"
  >
    <app-icon name="plus" [size]="16" [strokeWidth]="2.2" />
  </button>
</div>
