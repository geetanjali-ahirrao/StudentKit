<div class="table" [formGroup]="form">
  <div class="table__head" role="row">
    <span role="columnheader">Product Details</span>
    <span role="columnheader">Quantity</span>
    <span role="columnheader">Subtotal</span>
    <span role="columnheader" class="table__head-action">Add to cart</span>
  </div>

  @if (loading()) {
    @for (skeleton of skeletons; track skeleton) {
      <div class="skeleton-row">
        <div class="skeleton skeleton--thumb"></div>
        <div class="skeleton-lines">
          <div class="skeleton skeleton--line"></div>
          <div class="skeleton skeleton--line skeleton--short"></div>
        </div>
      </div>
    }
  } @else {
    @for (row of rows(); track row.kit.id) {
      <app-kit-row
        [kit]="row.kit"
        [group]="groupAt(row.index)"
        [inCart]="cartQuantities().get(row.kit.id) ?? 0"
        (add)="addToCart(row.index)"
      />
    } @empty {
      <div class="empty">
        <app-icon name="search" [size]="28" [strokeWidth]="1.4" />
        <p class="empty__title">No kits match "{{ search() }}"</p>
        <p class="empty__text">Check the kit code, or clear the search to see all four kits.</p>
      </div>
    }
  }
</div>
